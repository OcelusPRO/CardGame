ktor:
  deployment:
    port: 8080
  application:
    modules:
      - fr.ftnl.cardgame.ApplicationKt.module

app:
  database:
    url: "$DATABASE_URL:jdbc:postgresql://localhost:5432/cardgame"
    user: "$DATABASE_USER:cardgame"
    password: "$DATABASE_PASSWORD:cardgame"
    driver: "$DATABASE_DRIVER:org.postgresql.Driver"
    poolSize: "$DATABASE_POOL_SIZE:8"
  redis:
    enabled: "$REDIS_ENABLED:true"
    url: "$REDIS_URL:redis://localhost:6379"
    sessionTtlMinutes: "$REDIS_SESSION_TTL_MINUTES:180"
  discord:
    clientId: "$DISCORD_CLIENT_ID:"
    clientSecret: "$DISCORD_CLIENT_SECRET:"
    redirectUrl: "$DISCORD_REDIRECT_URL:http://localhost:8080/auth/discord/callback"
    # Facultatif : permet à l'administration de retrouver un pseudo depuis un identifiant.
    botToken: "$DISCORD_BOT_TOKEN:"
  twitch:
    clientId: "$TWITCH_CLIENT_ID:"
    clientSecret: "$TWITCH_CLIENT_SECRET:"
    redirectUrl: "$TWITCH_REDIRECT_URL:http://localhost:8080/auth/twitch/callback"
  admin:
    discordIds: "$ADMIN_DISCORD_IDS:"
    twitchIds: "$ADMIN_TWITCH_IDS:"
  adultAccess:
    # A Discord account at least this many days old is trusted as an adult for the 18+
    # packs, on top of the allowlist. Set to 0 to rely on the allowlist alone.
    minAccountAgeDays: "$ADULT_MIN_ACCOUNT_AGE_DAYS:1095"
  session:
    signKey: "$SESSION_SIGN_KEY:dev-secret-change-me-please-32chars"
  seed:
    enabled: "$SEED_DEV_DECK:false"
