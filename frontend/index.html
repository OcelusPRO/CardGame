      rel="stylesheet"
    />
    <title>SansFiltres — le jeu de cartes qui dérape</title>

    <!--
      The theme is settled before the first paint. React sets the same attribute a moment
      later, but "a moment" is long enough for a white page to flash at someone who asked
      for a dark one, and that flash is the whole thing they would remember.
    -->
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('sansfiltres:theme') || '"system"')
          var dark = saved === 'system' || saved === null
            ? matchMedia('(prefers-color-scheme: dark)').matches
            : saved === 'dark'
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          /* Storage blocked, or a value we no longer understand: daylight it is. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
