services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Sur la boucle locale seulement : c'est un accès de dépannage, pas un service exposé.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cardgame}
      POSTGRES_USER: ${POSTGRES_USER:-cardgame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardgame}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces a real TCP check: the socket is up during init before the
      # server actually accepts network connections, which would flip the check green too soon.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-cardgame} -d ${POSTGRES_DB:-cardgame}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: harbor.ftnl.link/yarp/cardgame:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cardgame}
      DATABASE_USER: ${POSTGRES_USER:-cardgame}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-cardgame}
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      SESSION_SIGN_KEY: ${SESSION_SIGN_KEY:-dev-secret-change-me-please-32chars}
      SEED_DEV_DECK: ${SEED_DEV_DECK:-true}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URL: ${DISCORD_REDIRECT_URL:-http://localhost:8080/auth/discord/callback}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      TWITCH_REDIRECT_URL: ${TWITCH_REDIRECT_URL:-http://localhost:8080/auth/twitch/callback}
      ADMIN_DISCORD_IDS: ${ADMIN_DISCORD_IDS:-}
      ADMIN_TWITCH_IDS: ${ADMIN_TWITCH_IDS:-}

volumes:
  postgres-data:
